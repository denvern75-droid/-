# Hermes Agent MCP 연결 설정 예시
# - Hermes 설정 파일(config.yaml)의 mcp_servers 항목에 병합함
# - 키 이름·형식은 사용 중인 Hermes 버전의 공식 문서로 반드시 확인 후 적용함
# - 비밀번호·토큰은 이 파일에 직접 쓰지 않고 환경변수 또는 Hermes 비밀 저장소를 사용함

mcp_servers:
  # 1) 볼트(구글드라이브 동기화 폴더) — 파일시스템 MCP, 볼트 경로만 허용
  vault:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "G:/내 드라이브/SecondBrain"   # 실제 Drive for desktop 경로로 치환

  # 2) Gmail — 사용 중인 Gmail MCP 서버로 교체
  #    필요 권한: 읽기, 라벨 추가 (발송·삭제 권한은 부여하지 않는 것을 권장)
  # gmail:
  #   command: <gmail-mcp 실행 명령>
  #   env:
  #     GOOGLE_OAUTH_CREDENTIALS: "${GOOGLE_OAUTH_CREDENTIALS}"

  # 3) Google Calendar — 아침 브리핑·긴급 알림용 (읽기 전용 권장)
  # calendar:
  #   command: <calendar-mcp 실행 명령>

  # 4) 카카오 나에게 보내기 — 현재 사용 중인 연결 방식 유지
  #    (예: 카카오 PlayMCP 원격 MCP, 또는 카카오 API 'talk/memo' 호출 스크립트)
  # kakao:
  #   url: <PlayMCP 엔드포인트>
  #   headers:
  #     Authorization: "Bearer ${KAKAO_MCP_TOKEN}"

# 참고
# - 구글드라이브는 Drive for desktop으로 로컬 동기화하므로 별도 Drive MCP 없이 vault MCP로 접근 가능함
# - 텔레그램은 Hermes 게이트웨이로 이미 연결되어 있어 MCP 추가가 필요 없음
# - 텔레그램 봇 허용 사용자는 본인 ID로만 제한함
